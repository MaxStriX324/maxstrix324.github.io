name: Import own DRIVE2 project photos

on:
  push:
    paths:
      - '.github/workflows/import-project-photos.yml'
      - 'scripts/import_drive2_photos.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-project-photos
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Fetch, validate, and optimize original photos
        run: python scripts/import_drive2_photos.py
      - name: Commit local images to site repository
        run: |
          git add assets/projects/paz-3206/
          if git diff --cached --quiet; then
            echo "No image updates required"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Store PAZ-3206 project photography locally"
          git push
